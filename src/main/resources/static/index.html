<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            width: auto;
        }

        .btn-success:hover {
            background: var(--success);
            color: white;
        }

        .task-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .task-list-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(4px);
        }

        .task-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .task-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-PENDING {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-IN_PROGRESS {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .status-COMPLETED {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .priority-LOW {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .priority-MEDIUM {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .priority-HIGH {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-COMPLETED_DUPLICATE {
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .task-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Task Manager Dashboard</h1>
            <p>Powered by Spring Boot REST API & Podman Containerization</p>
            <span class="badge">Live API Connected</span>
        </header>

        <!-- Form Tambah Task -->
        <div class="card">
            <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Tambah Task Baru</h2>
            <form id="createTaskForm">
                <div class="form-group">
                    <label for="title">Judul Task</label>
                    <input type="text" id="title" class="form-control" placeholder="Contoh: Deploy Aplikasi ke Podman"
                        required>
                </div>
                <div class="form-group">
                    <label for="assignee">Assignee (Penanggung Jawab)</label>
                    <input type="text" id="assignee" class="form-control" placeholder="Contoh: humairaelfi">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="description">Deskripsi</label>
                        <input type="text" id="description" class="form-control" placeholder="Deskripsi singkat tugas">
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" class="form-control">
                            <option value="PENDING">PENDING</option>
                            <option value="IN_PROGRESS">IN_PROGRESS</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" class="form-control">
                            <option value="LOW">LOW</option>
                            <option value="MEDIUM">MEDIUM</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn">+ Simpan Task</button>
            </form>
        </div>

        <!-- Daftar Task -->
        <div class="card">
            <div class="task-list-header">
                <h2>Daftar Task (<span id="taskCount">0</span>)</h2>
                <button onclick="loadTasks()" class="btn"
                    style="width: auto; padding: 0.4rem 1rem; font-size: 0.85rem;">🔄 Refresh</button>
            </div>
            <div id="taskList">
                <div class="empty-state">
                    <p>Memuat data task...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/tasks';

        async function loadTasks() {
            try {
                const res = await fetch(API_URL);
                const tasks = await res.json();

                document.getElementById('taskCount').innerText = tasks.length;
                const container = document.getElementById('taskList');

                if (tasks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                            <p>Belum ada task. Silakan tambah task baru di atas!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = tasks.map(task => `
                    <div class="task-item">
                        <div class="task-info">
                            <h3>${escapeHtml(task.title)} <span class="status-badge status-${task.status}">${task.status}</span> <span class="status-badge priority-${task.priority || 'LOW'}">${task.priority || 'LOW'}</span></h3>
                            <p>${escapeHtml(task.description || 'Tidak ada deskripsi')} ${task.assignee ? '— 👤 <strong>' + escapeHtml(task.assignee) + '</strong>' : ''}</p>
                        </div>
                        <div class="task-actions">
                            ${task.status !== 'COMPLETED' ? `
                                <button class="btn btn-success" onclick="markCompleted(${task.id}, '${escapeHtml(task.title)}', '${escapeHtml(task.description || '')}')">✓ Selesai</button>
                            ` : ''}
                            <button class="btn btn-danger" onclick="deleteTask(${task.id})">🗑 Hapus</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Gagal memuat task:", err);
            }
        }

        document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const status = document.getElementById('status').value;
            const priority = document.getElementById('priority').value;
            const assignee = document.getElementById('assignee').value;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, status, priority, assignee })
                });

                if (res.ok) {
                    document.getElementById('title').value = '';
                    document.getElementById('description').value = '';
                    loadTasks();
                }
            } catch (err) {
                alert("Gagal menambahkan task");
            }
        });

        async function markCompleted(id, title, description) {
            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, status: 'COMPLETED' })
                });
                loadTasks();
            } catch (err) {
                alert("Gagal memperbarui status task");
            }
        }

        async function deleteTask(id) {
            if (!confirm("Hapus task ini?")) return;
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                loadTasks();
            } catch (err) {
                alert("Gagal menghapus task");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Load tasks on page load
        loadTasks();
    </script>
</body>

</html>
